<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrice RACI - Suivi Cardiologique</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MatriceRaci = () => {
          // Définition des catégories possibles
          const categories = ['R', 'A', 'C', 'I', 'A/R', ''];

          // Structure initiale de la matrice avec les nouvelles données
          const [headerRow] = useState([
            { id: 'task', label: 'Actions', type: 'header' },
            { id: 'mg', label: 'MG', type: 'header' },
            { id: 'ide', label: 'IDE', type: 'header' },
            { id: 'asalee', label: 'ASALÉE', type: 'header' },
            { id: 'pharmacien', label: 'PHARMACIEN', type: 'header' },
            { id: 'dieteticienne', label: 'DIÉTÉTICIENNE', type: 'header' },
            { id: 'biologiste', label: 'BIOLOGISTE', type: 'header' },
            { id: 'cardiologue', label: 'CARDIOLOGUE', type: 'header' },
          ]);

          // Données initiales par défaut
          const defaultRows = [
            {
              id: 'row1',
              task: '1.1 Prescrire carnet de poids + seuil d\'alerte',
              assignments: { mg: 'A/R', ide: 'I', asalee: 'C', pharmacien: 'I', dieteticienne: 'C', biologiste: 'I', cardiologue: 'I' }
            },
            {
              id: 'row2',
              task: '1.2 Vérifier le carnet lors des visites',
              assignments: { mg: 'I', ide: 'R', asalee: 'C', pharmacien: 'I', dieteticienne: 'C', biologiste: 'I', cardiologue: 'I' }
            },
            {
              id: 'row3',
              task: '1.3 Éduquer : lien sel / rétention d\'eau',
              assignments: { mg: 'C', ide: 'I', asalee: 'I', pharmacien: 'C', dieteticienne: 'R', biologiste: 'I', cardiologue: 'I' }
            },
            {
              id: 'row4',
              task: '1.4 Alerter si dépassement du seuil (>2 kg / 3 jours)',
              assignments: { mg: 'I', ide: 'R', asalee: 'C', pharmacien: 'C', dieteticienne: 'I', biologiste: 'I', cardiologue: 'I' }
            },
            {
              id: 'row5',
              task: '2.1 Prescrire dosage BNP/NT-proBNP',
              assignments: { mg: 'A/R', ide: 'I', asalee: 'I', pharmacien: 'C', dieteticienne: 'I', biologiste: 'C', cardiologue: 'I' }
            },
            {
              id: 'row6',
              task: '2.2 Réaliser le prélèvement sanguin',
              assignments: { mg: 'I', ide: 'R', asalee: 'I', pharmacien: 'I', dieteticienne: 'I', biologiste: 'I', cardiologue: 'I' }
            },
            {
              id: 'row7',
              task: '2.3 Analyser les résultats (<48h)',
              assignments: { mg: 'I', ide: 'I', asalee: 'I', pharmacien: 'I', dieteticienne: 'I', biologiste: 'A/R', cardiologue: 'I' }
            },
            {
              id: 'row8',
              task: '2.4 Interpréter les résultats (seuils HAS)',
              assignments: { mg: 'A/R', ide: 'C', asalee: 'C', pharmacien: 'C', dieteticienne: 'I', biologiste: 'C', cardiologue: 'C' }
            },
            {
              id: 'row9',
              task: '3.1 Intégrer les résultats de pesée',
              assignments: { mg: 'R', ide: 'R', asalee: 'C', pharmacien: 'I', dieteticienne: 'C', biologiste: 'I', cardiologue: 'I' }
            },
            {
              id: 'row10',
              task: '3.2 Intégrer les résultats biologiques',
              assignments: { mg: 'R', ide: 'I', asalee: 'I', pharmacien: 'C', dieteticienne: 'I', biologiste: 'R', cardiologue: 'I' }
            },
            {
              id: 'row11',
              task: '4.1 Identifier la situation (OAP, choc, etc.)',
              assignments: { mg: 'R', ide: 'R', asalee: 'C', pharmacien: 'C', dieteticienne: 'I', biologiste: 'I', cardiologue: 'C' }
            },
            {
              id: 'row12',
              task: '4.2 Contacter le cardiologue référent',
              assignments: { mg: 'R', ide: 'I', asalee: 'I', pharmacien: 'I', dieteticienne: 'I', biologiste: 'I', cardiologue: 'A' }
            },
            {
              id: 'row13',
              task: '4.3 Coordonner les soins urgents',
              assignments: { mg: 'C', ide: 'C', asalee: 'I', pharmacien: 'I', dieteticienne: 'I', biologiste: 'I', cardiologue: 'A/R' }
            },
            {
              id: 'row14',
              task: '5.1 Ajuster les diurétiques et le traitement',
              assignments: { mg: 'A/R', ide: 'C', asalee: 'C', pharmacien: 'C', dieteticienne: 'C', biologiste: 'I', cardiologue: 'C' }
            },
            {
              id: 'row15',
              task: '5.2 Organiser un suivi rapproché',
              assignments: { mg: 'I', ide: 'R', asalee: 'R', pharmacien: 'I', dieteticienne: 'C', biologiste: 'I', cardiologue: 'I' }
            },
          ];

          // Chargement depuis localStorage ou données par défaut
          const loadFromStorage = () => {
            try {
              const savedData = localStorage.getItem('matriceRaciData');
              if (savedData) {
                return JSON.parse(savedData);
              }
            } catch (e) {
              console.error('Erreur de chargement:', e);
            }
            return {
              rows: defaultRows,
              title: 'MATRICE RACI',
              subtitle: 'SUIVI CARDIOLOGIQUE INSUFFISANCE CARDIAQUE'
            };
          };

          const initialData = loadFromStorage();
          const [rows, setRows] = useState(initialData.rows);
          const [title, setTitle] = useState(initialData.title);
          const [subtitle, setSubtitle] = useState(initialData.subtitle);

          // Sauvegarde automatique dans localStorage
          useEffect(() => {
            try {
              const dataToSave = {
                rows,
                title,
                subtitle
              };
              localStorage.setItem('matriceRaciData', JSON.stringify(dataToSave));
            } catch (e) {
              console.error('Erreur de sauvegarde:', e);
            }
          }, [rows, title, subtitle]);

          // Fonction de validation d'une ligne
          const validateRow = (assignments) => {
            const values = Object.values(assignments);
            
            // Compte les R (incluant A/R)
            const rCount = values.filter(v => v === 'R' || v === 'A/R').length;
            
            // Compte les A (incluant A/R)
            const aCount = values.filter(v => v === 'A' || v === 'A/R').length;
            
            const errors = [];
            
            if (rCount === 0) {
              errors.push('Aucun Responsable (R)');
            } else if (rCount > 1) {
              errors.push(`${rCount} Responsables (R) - il en faut 1 seul`);
            }
            
            if (aCount === 0) {
              errors.push('Aucune Approbation (A)');
            } else if (aCount > 1) {
              errors.push(`${aCount} Approbations (A) - il en faut 1 seule`);
            }
            
            return {
              isValid: errors.length === 0,
              errors: errors
            };
          };

          // Calcul des statistiques globales
          const getGlobalStats = () => {
            const validRows = rows.filter(row => validateRow(row.assignments).isValid).length;
            const totalRows = rows.length;
            const invalidRows = totalRows - validRows;
            
            return { validRows, totalRows, invalidRows };
          };

          // Fonction pour changer une attribution
          const handleCellChange = (rowId, column) => {
            setRows(prevRows => {
              return prevRows.map(row => {
                if (row.id === rowId) {
                  const currentIndex = categories.indexOf(row.assignments[column] || '');
                  const nextIndex = (currentIndex + 1) % categories.length;
                  return {
                    ...row,
                    assignments: {
                      ...row.assignments,
                      [column]: categories[nextIndex]
                    }
                  };
                }
                return row;
              });
            });
          };

          // Fonction pour ajouter une nouvelle ligne
          const addRow = () => {
            const newRowId = `row${Date.now()}`;
            setRows([...rows, {
              id: newRowId,
              task: 'Nouvelle tâche',
              assignments: { mg: '', ide: '', asalee: '', pharmacien: '', dieteticienne: '', biologiste: '', cardiologue: '' }
            }]);
          };

          // Fonction pour supprimer une ligne
          const deleteRow = (rowId) => {
            setRows(rows.filter(row => row.id !== rowId));
          };

          // Fonction pour modifier le nom d'une tâche
          const handleTaskNameChange = (rowId, newName) => {
            setRows(prevRows => {
              return prevRows.map(row => {
                if (row.id === rowId) {
                  return { ...row, task: newName };
                }
                return row;
              });
            });
          };

          // Fonction de réinitialisation
          const resetToDefault = () => {
            if (confirm('Voulez-vous vraiment réinitialiser la matrice aux valeurs par défaut ? Toutes vos modifications seront perdues.')) {
              setRows(defaultRows);
              setTitle('MATRICE RACI');
              setSubtitle('SUIVI CARDIOLOGIQUE INSUFFISANCE CARDIAQUE');
            }
          };

          // Fonction d'export PDF
          const exportToPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            
            // Titre
            doc.setFontSize(18);
            doc.setTextColor(62, 107, 97);
            doc.text(title, doc.internal.pageSize.getWidth() / 2, 15, { align: 'center' });
            
            // Sous-titre
            doc.setFontSize(14);
            doc.setFont(undefined, 'italic');
            doc.text(subtitle, doc.internal.pageSize.getWidth() / 2, 23, { align: 'center' });
            
            // Date de génération
            doc.setFontSize(9);
            doc.setFont(undefined, 'normal');
            doc.setTextColor(100);
            const now = new Date();
            const dateStr = `Généré le ${now.toLocaleDateString('fr-FR')} à ${now.toLocaleTimeString('fr-FR')}`;
            doc.text(dateStr, doc.internal.pageSize.getWidth() / 2, 30, { align: 'center' });
            
            // Préparer les données du tableau
            const headers = [
              ['✓', 'Actions', 'MG', 'IDE', 'ASALÉE', 'PHARMACIEN', 'DIÉTÉTICIENNE', 'BIOLOGISTE', 'CARDIOLOGUE']
            ];
            
            const data = rows.map(row => {
              const validation = validateRow(row.assignments);
              return [
                validation.isValid ? '✓' : '⚠',
                row.task,
                row.assignments.mg || '',
                row.assignments.ide || '',
                row.assignments.asalee || '',
                row.assignments.pharmacien || '',
                row.assignments.dieteticienne || '',
                row.assignments.biologiste || '',
                row.assignments.cardiologue || ''
              ];
            });
            
            // Configuration des couleurs
            const getColorForValue = (value) => {
              switch (value) {
                case 'R': return [62, 107, 97];
                case 'A': return [78, 133, 119];
                case 'C': return [111, 168, 154];
                case 'I': return [143, 191, 181];
                case 'A/R': return [62, 107, 97];
                default: return [245, 245, 245];
              }
            };
            
            // Créer le tableau
            doc.autoTable({
              head: headers,
              body: data,
              startY: 35,
              theme: 'grid',
              headStyles: {
                fillColor: [245, 245, 245],
                textColor: [0, 0, 0],
                fontStyle: 'bold',
                halign: 'center',
                fontSize: 9
              },
              bodyStyles: {
                fontSize: 8,
                cellPadding: 2
              },
              columnStyles: {
                0: { halign: 'center', cellWidth: 10 },
                1: { cellWidth: 60 },
                2: { halign: 'center', cellWidth: 18 },
                3: { halign: 'center', cellWidth: 18 },
                4: { halign: 'center', cellWidth: 20 },
                5: { halign: 'center', cellWidth: 28 },
                6: { halign: 'center', cellWidth: 30 },
                7: { halign: 'center', cellWidth: 26 },
                8: { halign: 'center', cellWidth: 28 }
              },
              didParseCell: (data) => {
                // Colorer les cellules RACI
                if (data.section === 'body' && data.column.index > 1) {
                  const value = data.cell.raw;
                  if (value && value !== '') {
                    const color = getColorForValue(value);
                    data.cell.styles.fillColor = color;
                    data.cell.styles.textColor = [255, 255, 255];
                    data.cell.styles.fontStyle = 'bold';
                  }
                }
                // Colorer la colonne de validation
                if (data.section === 'body' && data.column.index === 0) {
                  if (data.cell.raw === '⚠') {
                    data.cell.styles.textColor = [255, 140, 0];
                  } else {
                    data.cell.styles.textColor = [34, 139, 34];
                  }
                }
              },
              margin: { top: 35, right: 10, bottom: 25, left: 10 }
            });
            
            // Légende en bas de page
            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(10);
            doc.setTextColor(0);
            doc.setFont(undefined, 'bold');
            doc.text('Légende :', 15, finalY);
            
            doc.setFont(undefined, 'normal');
            doc.setFontSize(9);
            let legendY = finalY + 5;
            
            // R
            doc.setFillColor(62, 107, 97);
            doc.rect(15, legendY, 8, 5, 'F');
            doc.setTextColor(0);
            doc.text('R = Responsable (réalise la tâche)', 25, legendY + 3.5);
            
            // A
            doc.setFillColor(78, 133, 119);
            doc.rect(90, legendY, 8, 5, 'F');
            doc.text('A = Approbation (décide et valide)', 100, legendY + 3.5);
            
            legendY += 7;
            
            // C
            doc.setFillColor(111, 168, 154);
            doc.rect(15, legendY, 8, 5, 'F');
            doc.text('C = Consulté (donné son avis)', 25, legendY + 3.5);
            
            // I
            doc.setFillColor(143, 191, 181);
            doc.rect(90, legendY, 8, 5, 'F');
            doc.text('I = Informé (tenu au courant)', 100, legendY + 3.5);
            
            // Sauvegarder le PDF
            const filename = `matrice-raci-${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}.pdf`;
            doc.save(filename);
          };

          // Couleurs associées aux différentes responsabilités
          const getCellColor = (value) => {
            switch (value) {
              case 'R': return '#3e6b61';
              case 'A': return '#4e8577';
              case 'C': return '#6fa89a';
              case 'I': return '#8fbfb5';
              case 'A/R': return '#3e6b61';
              default: return '#f5f5f5';
            }
          };
          
          // Couleurs pour les éléments de la légende
          const legendColors = {
            R: '#3e6b61',
            A: '#4e8577',
            C: '#6fa89a',
            I: '#8fbfb5'
          };

          const headerColor = '#f5f5f5';
          const taskColor = '#f5f5f5';

          const stats = getGlobalStats();

          return (
            <div className="flex flex-col w-full max-w-7xl mx-auto p-4 bg-white">
              <div className="flex justify-between items-center mb-4">
                <div className="flex-1">
                  <div className="flex items-center mb-2">
                    <div className="text-white flex items-center justify-center mr-2 text-lg" style={{ 
                      backgroundColor: legendColors.R,
                      width: "50px",
                      height: "50px"
                    }}>R</div>
                    <span>Responsable</span>
                  </div>
                  <div className="flex items-center">
                    <div className="text-white flex items-center justify-center mr-2 text-lg" style={{ 
                      backgroundColor: legendColors.A,
                      width: "50px",
                      height: "50px"
                    }}>A</div>
                    <span>Approbation</span>
                  </div>
                </div>
                <div className="flex-2 text-center">
                  <input 
                    type="text" 
                    value={title} 
                    onChange={(e) => setTitle(e.target.value)} 
                    className="text-2xl font-bold text-center border-b-2 border-transparent focus:border-blue-500 focus:outline-none"
                    style={{ color: legendColors.R }}
                  />
                  <br />
                  <input 
                    type="text" 
                    value={subtitle} 
                    onChange={(e) => setSubtitle(e.target.value)} 
                    className="text-xl italic text-center border-b-2 border-transparent focus:border-blue-500 focus:outline-none"
                    style={{ color: legendColors.R }}
                  />
                </div>
                <div className="flex-1 text-right">
                  <div className="flex items-center justify-end mb-2">
                    <span>Consulté</span>
                    <div className="text-white flex items-center justify-center ml-2 text-lg" style={{ 
                      backgroundColor: legendColors.C,
                      width: "50px",
                      height: "50px"
                    }}>C</div>
                  </div>
                  <div className="flex items-center justify-end">
                    <span>Informé</span>
                    <div className="text-white flex items-center justify-center ml-2 text-lg" style={{ 
                      backgroundColor: legendColors.I,
                      width: "50px",
                      height: "50px"
                    }}>I</div>
                  </div>
                </div>
              </div>

              {/* Statistiques globales et boutons d'action */}
              <div className="mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <div className="text-sm font-semibold">État de la matrice :</div>
                    <span className="text-sm">
                      <span className="text-green-600 font-bold">{stats.validRows}</span> / {stats.totalRows} tâches valides
                    </span>
                    {stats.invalidRows > 0 && (
                      <span className="text-sm text-orange-600 font-bold">
                        {stats.invalidRows} tâche{stats.invalidRows > 1 ? 's' : ''} à corriger
                      </span>
                    )}
                  </div>
                  <div className="flex gap-2 no-print">
                    <button 
                      onClick={exportToPDF}
                      className="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 flex items-center gap-2"
                      title="Télécharger en PDF"
                    >
                      📥 PDF
                    </button>
                    <button 
                      onClick={resetToDefault}
                      className="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
                      title="Réinitialiser aux valeurs par défaut"
                    >
                      🔄 Réinitialiser
                    </button>
                  </div>
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full border-collapse">
                  <thead>
                    <tr>
                      <th 
                        className="p-2 font-semibold text-center text-sm border w-8"
                        style={{ backgroundColor: headerColor }}
                      >
                        ✓
                      </th>
                      {headerRow.map((header, index) => (
                        <th 
                          key={header.id}
                          className={`p-2 font-semibold text-center text-sm border ${index === 0 ? 'w-1/4' : ''}`}
                          style={{ 
                            backgroundColor: headerColor,
                            ...(index !== 0 && {
                              height: '150px',
                              verticalAlign: 'bottom',
                              position: 'relative'
                            })
                          }}
                        >
                          {index === 0 ? (
                            header.label
                          ) : (
                            <div style={{
                              transform: 'rotate(-45deg)',
                              transformOrigin: 'center center',
                              whiteSpace: 'nowrap',
                              position: 'absolute',
                              bottom: '30px',
                              left: '50%',
                              marginLeft: '-30px',
                              width: '100px'
                            }}>
                              {header.label}
                            </div>
                          )}
                        </th>
                      ))}
                      <th className="p-2 font-semibold text-center text-sm border no-print" style={{ 
                        backgroundColor: headerColor,
                        height: '150px',
                        verticalAlign: 'bottom'
                      }}>
                        Actions
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map(row => {
                      const validation = validateRow(row.assignments);
                      return (
                        <tr key={row.id} className={!validation.isValid ? 'bg-orange-50' : ''}>
                          <td className="p-1 border text-center">
                            {validation.isValid ? (
                              <span className="text-green-600 text-xl" title="Tâche valide">✓</span>
                            ) : (
                              <span 
                                className="text-orange-600 text-xl cursor-help" 
                                title={validation.errors.join('\n')}
                              >
                                ⚠
                              </span>
                            )}
                          </td>
                          <td 
                            className="p-2 border"
                            style={{ backgroundColor: taskColor }}
                          >
                            <input 
                              type="text" 
                              value={row.task} 
                              onChange={(e) => handleTaskNameChange(row.id, e.target.value)}
                              className="w-full bg-transparent border-b border-gray-300 focus:border-blue-500 focus:outline-none text-sm"
                            />
                            {!validation.isValid && (
                              <div className="text-xs text-orange-600 mt-1 no-print">
                                {validation.errors.join(' • ')}
                              </div>
                            )}
                          </td>
                          {Object.entries(row.assignments).map(([column, value]) => (
                            <td key={`${row.id}-${column}`} className="p-1 border text-center">
                              <div 
                                className="text-center text-white font-bold cursor-pointer flex items-center justify-center text-lg mx-auto"
                                style={{ 
                                  backgroundColor: getCellColor(value),
                                  width: "55px",
                                  height: "55px"
                                }}
                                onClick={() => handleCellChange(row.id, column)}
                              >
                                {value}
                              </div>
                            </td>
                          ))}
                          <td className="p-2 border text-center no-print">
                            <button 
                              onClick={() => deleteRow(row.id)}
                              className="bg-red-500 text-white px-2 py-1 rounded text-sm hover:bg-red-600"
                            >
                              X
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              <div className="mt-4 no-print">
                <button 
                  onClick={addRow}
                  className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                >
                  Ajouter une ligne
                </button>
              </div>

              <div className="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
                <h3 className="font-semibold mb-2 text-blue-900">Règles de validation RACI :</h3>
                <ul className="text-sm text-blue-800 space-y-1">
                  <li>• Chaque tâche doit avoir <strong>exactement 1 Responsable (R)</strong> qui réalise la tâche</li>
                  <li>• Chaque tâche doit avoir <strong>exactement 1 Approbation (A)</strong> qui décide et valide</li>
                  <li>• A/R signifie que la même personne est à la fois Responsable et Approbateur</li>
                  <li>• C (Consulté) et I (Informé) peuvent être multiples sans limite</li>
                </ul>
              </div>

              <div className="mt-4 p-4 bg-green-50 rounded-lg border border-green-200 no-print">
                <h3 className="font-semibold mb-2 text-green-900">💾 Sauvegarde automatique activée</h3>
